name: capital_humano_front
description: "Capital Humano de Grupo GPA. Frontend modular para web y móviles."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  animations: ^2.0.11
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  intl: ^0.20.2
  json_annotation: ^4.12.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.9
  freezed: 4.0.2
  json_serializable: ^6.14.1
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - lib/core/design_system/company-logo.png
  fonts:
    - family: Manrope
      fonts:
        - asset: lib/core/design_system/fonts/Manrope.ttf
